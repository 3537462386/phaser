<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Chess - Phaser3</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix-pixel-font@3.1.1/zpix.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
            font-family: "Zpix", monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(180deg, rgba(12, 8, 4, 0.72), rgba(28, 16, 8, 0.88)),
                #1a1208;
        }
        #game-container canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin: 0 auto;
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="js/Logic.js"></script>
    <script src="js/AI.js"></script>
    <script src="js/MenuScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/DarkChessScene.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
