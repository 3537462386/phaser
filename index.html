<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Chess - Phaser3</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/colyseus.js@0.15.0/dist/colyseus.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix-pixel-font@3.1.1/zpix.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
            font-family: "Zpix", monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: #2a2018; border: 2px solid #d4a355; border-radius: 4px; padding: 24px 28px; text-align: center; min-width: 280px; max-width: 340px; }
        .modal-box h3 { color: #f0d9b5; font-size: 20px; margin-bottom: 16px; font-family: "Zpix", monospace; font-weight: normal; letter-spacing: 2px; }
        .modal-box .room-code { color: #ffdd66; font-size: 28px; letter-spacing: 3px; margin: 12px 0; font-family: "Zpix", monospace; padding: 8px; background: #1a1208; border-radius: 4px; }
        .modal-box input { width: 100%; padding: 10px; font-size: 18px; text-align: center; letter-spacing: 4px; background: #1a1208; border: 1px solid #8b7355; color: #f0d9b5; font-family: "Zpix", monospace; border-radius: 4px; outline: none; text-transform: uppercase; }
        .modal-box input:focus { border-color: #d4a355; }
        .modal-box button { margin: 6px 4px; padding: 10px 18px; font-size: 14px; font-family: "Zpix", monospace; cursor: pointer; border: 1px solid #8b7355; border-radius: 4px; color: #f0d9b5; background: #4a3728; }
        .modal-box button:hover { background: #6b5a48; }
        .modal-box button.btn-primary { background: #6b4a24; border-color: #d4a355; }
        .modal-box button.btn-primary:hover { background: #8b6a34; }
        .modal-box p { color: #8b7355; font-size: 13px; margin-top: 10px; font-family: "Zpix", monospace; }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(180deg, rgba(12, 8, 4, 0.72), rgba(28, 16, 8, 0.88)),
                #1a1208;
        }
        #game-container canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin: 0 auto;
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="network-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3>房间码联机</h3>
            <input id="room-code-input" type="text" placeholder="输入房间码" maxlength="12" autocomplete="off" />
            <div id="room-code-display" class="room-code" style="display:none;"></div>
            <div>
                <button id="btn-create-room" class="btn-primary">创建房间</button>
                <button id="btn-join-room">加入房间</button>
            </div>
            <button id="btn-cancel-room">取消</button>
            <p id="room-status"></p>
        </div>
    </div>
    <script src="js/NetworkManager.js"></script>
    <script src="js/Logic.js"></script>
    <script src="js/AI.js"></script>
    <script src="js/MenuScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/DarkChessScene.js"></script>
    <script src="js/NetworkScene.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
